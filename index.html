<!DOCTYPE html>
<html>
    <head>
        <title>Halloween Codding Challenge</title>
        <link rel="stylesheet" href="haunted-harvest.css">
    </head>

    <body>
        <main>
            <div class="orbs">
                <div class="orbs orb1">⚪</div>
                <div class="orbs orb2">⚪</div>
                <div class="orbs orb3">⚪</div>
            </div>

            <div class="graveyard">
                <div class="grave-container">
                    <div class="grave">🪦</div>
                    <div class="ghost">👻</div>
                </div>

                <div class="grave-container">
                    <div class="grave">🪦</div>
                    <div class="ghost">👻</div>
                </div>
                
                <div class="grave-container">
                    <div class="grave">🪦</div>
                    <div class="ghost">👻</div>
                </div>
            </div>


            <div class="trees">
                <img src="assets/images/deadTree.png" alt="Brown tree with no leaves" class="tree">
                <img src="assets/images/deadTree.png" alt="Brown tree with no leaves" class="tree">
            </div>
            <!-- Added scene elements -->
            <div class="background">
                <!-- BULLET 1: A couple walking hand-in-hand along a path -->
                <div class="couple" role="img" aria-label="A couple walking hand in hand">🧑‍🤝‍🧑</div>

                <!-- BULLET 2: A black cat trotting behind them -->
                <div class="black-cat" role="img" aria-label="A black cat trotting">🐈‍⬛</div>

                <!-- ZOMBIE HAND: reaching out of the ground -->
                <div class="zombie-hand" role="img" aria-label="A zombie hand reaching out of the ground">
                    <div class="rise">
                        <div class="arm"></div>
                        <div class="hand">✋</div>
                    </div>
                </div>

                <!-- BULLET 6: A cyclist passes in the distance -->
                <div class="cyclist" role="img" aria-label="A cyclist riding past in the distance">🚴</div>

                <!-- BULLET 4: Clouds drifting across a glowing full moon -->
                <div class="moon"></div>
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>
        </main>
    

    </body>
</html>
