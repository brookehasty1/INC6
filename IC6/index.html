<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halloween Coding Challenge</title>
    <link rel="stylesheet" href="haunted-harvest.css">
</head>

<body>
    <main>
        <div class="background">
            <!-- BULLET 1: A couple walking hand-in-hand along a path -->
            <div class="couple" role="img" aria-label="A couple walking hand in hand">🧑‍🤝‍🧑</div>

            <!-- BULLET 2: A black cat trotting behind them -->
            <div class="black-cat" role="img" aria-label="A black cat trotting">🐈‍⬛</div>

            <!-- ZOMBIE HAND: reaching out of the ground -->
            <div class="zombie-hand" role="img" aria-label="A zombie hand reaching out of the ground">
                <div class="rise">
                    <div class="arm"></div>
                    <div class="hand">✋</div>
                </div>
            </div>

            <!-- BULLET 6: A cyclist passes in the distance -->
            <div class="cyclist" role="img" aria-label="A cyclist riding past in the distance">🚴</div>

            <!-- BULLET 4: Clouds drifting across a glowing full moon -->
            <div class="moon"></div>
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
            <div class="cloud cloud3"></div>
        </div>
    </main>
</body>
</html>
